<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERT / CPM — SkinnyProject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fondo animado con partículas / nodos -->
  <div class="bg-layer" aria-hidden="true">
    <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <!-- Nodos decorativos -->
      <circle class="bg-node n1" cx="12%"  cy="18%" r="6"/>
      <circle class="bg-node n2" cx="28%"  cy="72%" r="4"/>
      <circle class="bg-node n3" cx="48%"  cy="10%" r="5"/>
      <circle class="bg-node n4" cx="68%"  cy="80%" r="7"/>
      <circle class="bg-node n5" cx="82%"  cy="25%" r="4"/>
      <circle class="bg-node n6" cx="90%"  cy="60%" r="5"/>
      <circle class="bg-node n7" cx="38%"  cy="88%" r="3"/>
      <circle class="bg-node n8" cx="72%"  cy="45%" r="4"/>
      <!-- Flechas / aristas decorativas -->
      <line class="bg-edge" x1="12%" y1="18%" x2="28%" y2="72%"/>
      <line class="bg-edge" x1="28%" y1="72%" x2="48%" y2="10%"/>
      <line class="bg-edge" x1="48%" y1="10%" x2="68%" y2="80%"/>
      <line class="bg-edge" x1="68%" y1="80%" x2="82%" y2="25%"/>
      <line class="bg-edge" x1="82%" y1="25%" x2="90%" y2="60%"/>
      <line class="bg-edge" x1="12%" y1="18%" x2="72%" y2="45%"/>
      <line class="bg-edge" x1="72%" y1="45%" x2="90%" y2="60%"/>
      <line class="bg-edge" x1="38%" y1="88%" x2="68%" y2="80%"/>
    </svg>
    <!-- Capa de desenfoque -->
    <div class="bg-blur"></div>
  </div>

  <!-- Contenido central -->
  <main class="hero">
    <div class="card">
      <div class="logo-wrap">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PERT <span class="accent">/ CPM</span></span>
      </div>

      <p class="subtitle">Herramienta de planificación y ruta crítica</p>

      <p class="message">Ahora puedes usar PERT CPM en</p>

      <a
        class="url-link"
        href="https://skinnyproject.cl/apps/pert"
        target="_blank"
        rel="noopener noreferrer"
      >
        skinnyproject.cl/apps/pert
        <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>

      <div class="brand">
        <span class="brand-by">Desarrollado por</span>
        <span class="brand-name">Skinny<span class="brand-accent">Project</span></span>
      </div>
    </div>
  </main>

</body>
</html>
